[package]
name = "hello-world-webui-fast-server"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "hello-world-webui-fast-server"
path = "src/main.rs"

[dependencies]
microsoft-webui = "0.0.12"
microsoft-webui-handler = "0.0.12"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"
anyhow = "1"
mime_guess = "2"
tower-http = { version = "0.6", features = ["fs"] }
